<button class="text-on-surface dark:text-on-surface hover:opacity-70 transition-opacity duration-300 active:scale-95 transition-transform duration-200">

</button>
<span class="font-label-caps text-label-caps tracking-[0.2em] text-on-surface dark:text-on-surface absolute left-1/2 -translate-x-1/2">CALIBRATION</span>

</div>

<p class="font-body-lg text-body-lg text-on-surface-variant">Select any areas that require care.</p>
</div>

<input class="absolute w-0 h-0 opacity-0" type="checkbox"/>
<div class="flex justify-between items-start mb-auto">
<span class="material-symbols-outlined text-on-surface-variant group-has-[:checked]:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">airline_seat_legroom_extra</span>
<div class="w-4 h-4 rounded-full border border-surface-variant group-has-[:checked]:border-primary group-has-[:checked]:bg-primary flex items-center justify-center transition-all duration-300">

</div>

<div class="flex justify-between items-start mb-auto">
<span class="material-symbols-outlined text-on-surface-variant group-has-[:checked]:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">accessibility_new</span>

</div>
</div>
