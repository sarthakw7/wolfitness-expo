<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Calibration - Experience Level</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#748174",
                        "on-surface": "#e5e2e1",
                        "surface-variant": "#353434",
                        "error": "#ffb4ab",
                        "on-secondary-fixed-variant": "#474745",
                        "on-background": "#e5e2e1",
                        "surface-container": "#201f1f",
                        "secondary-container": "#474745",
                        "inverse-on-surface": "#313030",
                        "tertiary-fixed": "#d8e6d6",
                        "surface-bright": "#3a3939",
                        "outline-variant": "#444748",
                        "on-primary": "#313030",
                        "outline": "#8e9192",
                        "surface-container-low": "#1c1b1b",
                        "inverse-primary": "#5f5e5e",
                        "on-tertiary-fixed-variant": "#3e4a3e",
                        "on-secondary-fixed": "#1c1c1a",
                        "on-tertiary-fixed": "#131e14",
                        "secondary": "#c8c6c3",
                        "on-error-container": "#ffdad6",
                        "on-secondary-container": "#b7b5b2",
                        "tertiary": "#bccabb",
                        "on-surface-variant": "#c4c7c7",
                        "tertiary-fixed-dim": "#bccabb",
                        "on-secondary": "#31302f",
                        "on-tertiary": "#273329",
                        "surface-container-lowest": "#0e0e0e",
                        "on-primary-fixed-variant": "#474646",
                        "primary-container": "#121212",
                        "primary": "#c8c6c5",
                        "surface-tint": "#c8c6c5",
                        "surface-container-highest": "#353434",
                        "primary-fixed-dim": "#c8c6c5",
                        "on-primary-container": "#7e7d7d",
                        "surface": "#141313",
                        "tertiary-container": "#0a150c",
                        "secondary-fixed-dim": "#c8c6c3",
                        "error-container": "#93000a",
                        "primary-fixed": "#e5e2e1",
                        "inverse-surface": "#e5e2e1",
                        "background": "#141313",
                        "on-error": "#690005",
                        "surface-container-high": "#2b2a2a",
                        "surface-dim": "#141313",
                        "on-primary-fixed": "#1c1b1b",
                        "secondary-fixed": "#e5e2df"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "stack-md": "24px",
                        "stack-sm": "12px",
                        "gutter-grid": "24px",
                        "stack-lg": "48px",
                        "margin-page": "32px"
                    },
                    "fontFamily": {
                        "label-caps": ["Hanken Grotesk"],
                        "stats-number": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-caps": ["11px", { "lineHeight": "1.2", "letterSpacing": "0.12em", "fontWeight": "600" }],
                        "stats-number": ["32px", { "lineHeight": "1", "letterSpacing": "-0.03em", "fontWeight": "300" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "300" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-page h-16 bg-surface dark:bg-surface border-b border-surface-variant">
<button class="hover:opacity-70 transition-opacity duration-300 flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface dark:text-on-surface">arrow_back</span>
</button>
<span class="font-label-caps text-label-caps tracking-[0.2em] text-on-surface dark:text-on-surface">CALIBRATION</span>
<button class="hover:opacity-70 transition-opacity duration-300">
<span class="font-label-caps text-label-caps text-on-surface font-bold">SKIP</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-1 w-full max-w-[1440px] mx-auto px-margin-page pt-[120px] pb-[120px] flex flex-col">
<div class="max-w-2xl mx-auto w-full">
<!-- Progress Indicator -->
<div class="w-full h-[2px] bg-surface-container-highest mb-stack-lg rounded-full overflow-hidden">
<div class="h-full bg-on-surface w-1/4 transition-all duration-500 ease-in-out"></div>
</div>
<!-- Headline -->
<h1 class="font-display-lg text-display-lg text-on-surface mb-stack-lg">What is your experience level?</h1>
<!-- Options Stack -->
<div class="flex flex-col gap-stack-sm">
<!-- Option: Beginner -->
<button class="w-full text-left p-stack-md border border-surface-container-highest bg-transparent rounded-lg flex flex-col gap-unit hover:bg-surface-container-high transition-colors duration-300 group">
<span class="font-headline-md text-headline-md text-on-surface group-hover:text-primary transition-colors">Beginner</span>
<span class="font-body-lg text-body-lg text-on-surface-variant">New to structured training or returning after a prolonged period of inactivity.</span>
</button>
<!-- Option: Intermediate (Selected State Example) -->
<button class="w-full text-left p-stack-md border border-outline bg-surface-container-low rounded-lg flex flex-col gap-unit transition-colors duration-300 relative overflow-hidden">
<!-- Subtle active indicator -->
<div class="absolute left-0 top-0 bottom-0 w-[2px] bg-on-surface"></div>
<span class="font-headline-md text-headline-md text-on-surface">Intermediate</span>
<span class="font-body-lg text-body-lg text-on-surface-variant">Consistent training history for 1-2 years with familiarity of basic programming.</span>
</button>
<!-- Option: Advanced -->
<button class="w-full text-left p-stack-md border border-surface-container-highest bg-transparent rounded-lg flex flex-col gap-unit hover:bg-surface-container-high transition-colors duration-300 group">
<span class="font-headline-md text-headline-md text-on-surface group-hover:text-primary transition-colors">Advanced</span>
<span class="font-body-lg text-body-lg text-on-surface-variant">Highly experienced with a deep understanding of mechanics and competitive goals.</span>
</button>
<!-- Option: Elite -->
<button class="w-full text-left p-stack-md border border-surface-container-highest bg-transparent rounded-lg flex flex-col gap-unit hover:bg-surface-container-high transition-colors duration-300 group">
<span class="font-headline-md text-headline-md text-on-surface group-hover:text-primary transition-colors">Elite</span>
<span class="font-body-lg text-body-lg text-on-surface-variant">Professional or top-tier amateur athlete requiring highly specialized periodization.</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-margin-page pb-stack-md pt-stack-sm bg-transparent pointer-events-none">
<button class="hover:text-on-surface transition-colors pointer-events-auto">
<span class="material-symbols-outlined text-on-surface-variant p-unit">west</span>
</button>
<button class="hover:opacity-90 active:scale-90 transition-all pointer-events-auto shadow-[0_20px_40px_rgba(0,0,0,0.4)] rounded-full">
<span class="material-symbols-outlined bg-on-surface text-surface rounded-full p-stack-sm" style="font-variation-settings: 'FILL' 1;">east</span>
</button>
</nav>
</body></html>
