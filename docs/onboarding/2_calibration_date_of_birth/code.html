<body class="bg-background text-on-surface min-h-screen flex flex-col antialiased selection:bg-surface-variant selection:text-on-surface">
<!-- TopAppBar from JSON -->
<header class="bg-surface dark:bg-surface border-b border-surface-variant fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-page h-16">
<button aria-label="Go back" class="text-on-surface hover:opacity-70 transition-opacity duration-300 flex items-center justify-center p-unit focus:outline-none">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-label-caps text-label-caps tracking-[0.2em] text-on-surface dark:text-on-surface uppercase">
            CALIBRATION
        </div>
<button class="font-label-caps text-label-caps text-on-surface hover:opacity-70 transition-opacity duration-300 focus:outline-none uppercase">
            SKIP
        </button>
</header>
<!-- Progress Indicator -->
<div class="fixed top-16 left-0 w-full z-40 h-[2px] bg-surface-container-high">
<div class="h-full bg-on-surface w-1/4 transition-all duration-500 ease-in-out"></div>
</div>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col justify-center items-center px-margin-page pt-24 pb-stack-lg mt-16 max-w-[1440px] mx-auto w-full">
<div class="w-full max-w-lg flex flex-col items-center">
<!-- Headline -->
<h1 class="font-display-lg text-display-lg text-on-surface text-center mb-stack-lg leading-tight">
                When is your birthday?
            </h1>
<!-- Minimal Date Picker -->
<div class="flex items-end justify-center gap-stack-md w-full mb-stack-lg mt-stack-md">
<!-- Month -->
<div class="flex flex-col items-center w-24">
<input class="w-full bg-transparent border-0 border-b border-surface-variant text-center font-stats-number text-stats-number text-on-surface placeholder:text-surface-variant focus:ring-0 focus:border-on-surface focus:outline-none transition-colors pb-unit" inputmode="numeric" maxlength="2" placeholder="MM" type="text"/>
<span class="font-label-caps text-label-caps text-on-surface-variant mt-stack-sm uppercase">Month</span>
</div>
<div class="text-surface-variant font-stats-number text-stats-number pb-stack-sm select-none">/</div>
<!-- Day -->
<div class="flex flex-col items-center w-24">
<input class="w-full bg-transparent border-0 border-b border-surface-variant text-center font-stats-number text-stats-number text-on-surface placeholder:text-surface-variant focus:ring-0 focus:border-on-surface focus:outline-none transition-colors pb-unit" inputmode="numeric" maxlength="2" placeholder="DD" type="text"/>
<span class="font-label-caps text-label-caps text-on-surface-variant mt-stack-sm uppercase">Day</span>
</div>
<div class="text-surface-variant font-stats-number text-stats-number pb-stack-sm select-none">/</div>
<!-- Year -->
<div class="flex flex-col items-center w-32">
<input class="w-full bg-transparent border-0 border-b border-surface-variant text-center font-stats-number text-stats-number text-on-surface placeholder:text-surface-variant focus:ring-0 focus:border-on-surface focus:outline-none transition-colors pb-unit" inputmode="numeric" maxlength="4" placeholder="YYYY" type="text"/>
<span class="font-label-caps text-label-caps text-on-surface-variant mt-stack-sm uppercase">Year</span>
</div>
</div>
<!-- Continue Button -->
<button class="w-full md:w-auto min-w-[200px] mt-stack-lg bg-on-surface text-surface py-stack-sm px-stack-lg rounded-DEFAULT font-label-caps text-label-caps uppercase tracking-wider hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-on-surface focus:ring-offset-2 focus:ring-offset-background">
                Continue
            </button>
</div>
</main>
