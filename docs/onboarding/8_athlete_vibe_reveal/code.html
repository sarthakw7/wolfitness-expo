<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-page h-16 bg-surface dark:bg-surface border-b border-surface-variant docked full-width top-0 flat no shadows">
<button class="hover:opacity-70 transition-opacity duration-300 Active: scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-on-surface dark:text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-label-caps text-label-caps tracking-[0.2em] text-on-surface dark:text-on-surface">CALIBRATION</span>
<button class="font-label-caps text-label-caps text-on-surface dark:text-on-surface hover:opacity-70 transition-opacity duration-300 Active: scale-95 transition-transform duration-200">
            SKIP
        </button>
</header>
<!-- Main Canvas -->
<main class="flex-grow pt-24 pb-stack-lg px-margin-page flex flex-col justify-center items-center max-w-[1440px] mx-auto w-full relative z-10">
<!-- Background Imagery overlay for cinematic feel -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20 bg-cover bg-center" data-alt="A cinematic, low-light photograph of an athlete in motion, captured with a slow shutter speed to create a blurred, abstract sense of movement and raw power. The lighting is moody and dramatic, focusing on deep shadows and subtle highlights on the athlete's form. The scene uses a monochromatic or highly desaturated palette with deep blacks and stark whites, fitting a calm luxury aesthetic. The overall mood is intense, focused, and quiet." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBxVAVgIFBTXGpsAcsLEdQJIFUeIHNWcP5LV-Lj0iRx_5vkM9XJOiHFjJrdsU-QOhdfBc1Ml-0vtvT8tNbDcNlHsth7-caTYd4T-fHFlBLwlQyo0ixljG0ZdSpLO_Hqou7NAkttAHqvGUVa9IJTPr1HOkuQrISB6NNZo0GE9o731tzGOeQpo5V5hdV457-MSa_vwl4Ux5HMazL4sCTkE0K_x2DhL2PSWgecnmAYGf-Tv1AOaedaZNNvnwW815hlAxaGwVqMrTP61XCg');"></div>
<div class="absolute inset-0 z-0 pointer-events-none bg-gradient-to-b from-background via-transparent to-background"></div>
<div class="w-full max-w-2xl relative z-10 flex flex-col items-center text-center space-y-stack-lg">
<div class="space-y-stack-sm w-full">
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">YOUR ATHLETIC DNA</p>
<h1 class="font-display-lg text-display-lg text-on-surface uppercase tracking-tight">BALANCED</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto mt-unit">You master the harmony between explosive power and mindful recovery.</p>
</div>
<!-- Bento-style metrics -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-gutter-grid w-full">
<!-- Power -->
<div class="bg-surface border border-surface-variant p-stack-md flex flex-col items-center justify-center space-y-stack-sm">
<span class="font-label-caps text-label-caps text-on-surface-variant opacity-50 uppercase">Power</span>
<span class="font-stats-number text-stats-number text-on-surface">78</span>
<div class="w-full bg-surface-container-high h-[2px] mt-unit">
<div class="bg-primary h-full w-[78%]"></div>
</div>
</div>
<!-- Endurance -->
<div class="bg-surface border border-surface-variant p-stack-md flex flex-col items-center justify-center space-y-stack-sm">
<span class="font-label-caps text-label-caps text-on-surface-variant opacity-50 uppercase">Endurance</span>
<span class="font-stats-number text-stats-number text-on-surface">82</span>
<div class="w-full bg-surface-container-high h-[2px] mt-unit">
<div class="bg-primary h-full w-[82%]"></div>
</div>
</div>
<!-- Mobility -->
<div class="bg-surface border border-surface-variant p-stack-md flex flex-col items-center justify-center space-y-stack-sm">
<span class="font-label-caps text-label-caps text-on-surface-variant opacity-50 uppercase">Mobility</span>
<span class="font-stats-number text-stats-number text-on-surface">85</span>
<div class="w-full bg-surface-container-high h-[2px] mt-unit">
<div class="bg-primary h-full w-[85%]"></div>
</div>
</div>
</div>
<!-- CTA -->
<div class="w-full pt-stack-md">
<button class="w-full md:w-auto px-12 py-4 bg-primary text-on-primary font-label-caps text-label-caps uppercase tracking-widest hover:bg-on-surface transition-colors duration-300">
                    Continue to Sign Up
                </button>
