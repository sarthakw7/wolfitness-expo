<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up - Wolfitness</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#636262",
                        "outline": "#737971",
                        "on-tertiary-container": "#343633",
                        "outline-variant": "#c2c8bf",
                        "on-error-container": "#93000a",
                        "surface-tint": "#47664b",
                        "primary-container": "#86a789",
                        "background": "#fafaf2",
                        "surface-variant": "#e3e3db",
                        "on-surface": "#1a1c18",
                        "on-primary-container": "#1f3c25",
                        "on-tertiary-fixed": "#1a1c19",
                        "inverse-surface": "#2f312c",
                        "surface": "#fafaf2",
                        "on-primary-fixed-variant": "#304d35",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f4f4ec",
                        "surface-container-highest": "#e3e3db",
                        "surface-bright": "#fafaf2",
                        "tertiary-container": "#9e9f9b",
                        "inverse-on-surface": "#f1f1e9",
                        "on-tertiary-fixed-variant": "#454744",
                        "secondary-container": "#e2dfde",
                        "on-secondary": "#ffffff",
                        "secondary": "#5f5e5e",
                        "primary-fixed": "#c8ebca",
                        "on-secondary-fixed": "#1c1b1b",
                        "surface-container-high": "#e9e9e1",
                        "secondary-fixed": "#e5e2e1",
                        "inverse-primary": "#adcfaf",
                        "tertiary-fixed": "#e3e3de",
                        "primary-fixed-dim": "#adcfaf",
                        "primary": "#47664b",
                        "tertiary": "#5d5f5b",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#424842",
                        "on-secondary-fixed-variant": "#474746",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#c6c7c2",
                        "on-primary-fixed": "#03210c",
                        "on-error": "#ffffff",
                        "on-background": "#1a1c18",
                        "surface-dim": "#dadad3",
                        "surface-container": "#eeeee6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding-desktop": "64px",
                        "unit": "8px",
                        "section-gap": "48px",
                        "gutter": "16px",
                        "container-padding-mobile": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Playfair Display"],
                        "label-caps": ["Montserrat"],
                        "label-md": ["Montserrat"],
                        "body-lg": ["Montserrat"],
                        "headline-lg-mobile": ["Playfair Display"],
                        "body-md": ["Montserrat"],
                        "headline-md": ["Playfair Display"]
                    },
                    "fontSize": {
                        "headline-lg": ["40px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.15em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-md": ["28px", { "lineHeight": "1.3", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #fafaf2 inset !important;
            -webkit-text-fill-color: #1a1c18 !important;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Area -->
<main class="flex-grow flex flex-col justify-center px-container-padding-mobile md:px-container-padding-desktop py-section-gap relative">
<!-- Decorative Background Elements (Optional, subtle) -->
<div class="absolute inset-0 pointer-events-none overflow-hidden flex items-center justify-center opacity-5">
<div class="w-[80vw] h-[80vw] max-w-[800px] max-h-[800px] rounded-full bg-primary blur-3xl"></div>
</div>
<div class="w-full max-w-md mx-auto relative z-10 flex flex-col gap-12">
<!-- Header Section -->
<div class="flex flex-col items-center text-center gap-6">
<!-- Logo Mark -->
<div class="w-16 h-16 flex items-center justify-center mb-2">
    <img alt="Wolfitness Logo" class="h-16 w-16 object-contain opacity-90" src="../../assets/images/screen.png"/>
</div>
<div class="flex flex-col gap-2">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Join the Elite</h1>
<p class="font-body-md text-body-md text-secondary">Begin your journey to refined performance.</p>
</div>
</div>
<!-- Form Section -->
<form action="#" class="flex flex-col gap-8 w-full" method="POST">
<div class="flex flex-col gap-6">
<!-- Input: Full Name -->
<div class="relative group">
<input class="block w-full px-0 py-3 bg-transparent border-0 border-b border-outline-variant appearance-none focus:outline-none focus:ring-0 focus:border-primary peer text-on-surface font-body-md text-body-md transition-colors duration-300" id="fullName" name="fullName" placeholder=" " required="" type="text"/>
<label class="absolute top-3 left-0 -translate-y-6 text-label-caps font-label-caps text-secondary duration-300 transform origin-[0] peer-placeholder-shown:translate-y-0 peer-placeholder-shown:text-body-md peer-placeholder-shown:font-body-md peer-focus:-translate-y-6 peer-focus:text-label-caps peer-focus:font-label-caps peer-focus:text-primary cursor-text" for="fullName">
                            Full Name
                        </label>
</div>
<!-- Input: Email Address -->
<div class="relative group">
<input class="block w-full px-0 py-3 bg-transparent border-0 border-b border-outline-variant appearance-none focus:outline-none focus:ring-0 focus:border-primary peer text-on-surface font-body-md text-body-md transition-colors duration-300" id="email" name="email" placeholder=" " required="" type="email"/>
<label class="absolute top-3 left-0 -translate-y-6 text-label-caps font-label-caps text-secondary duration-300 transform origin-[0] peer-placeholder-shown:translate-y-0 peer-placeholder-shown:text-body-md peer-placeholder-shown:font-body-md peer-focus:-translate-y-6 peer-focus:text-label-caps peer-focus:font-label-caps peer-focus:text-primary cursor-text" for="email">
                            Email Address
                        </label>
</div>
<!-- Input: Create Password -->
<div class="relative group">
<input class="block w-full px-0 py-3 bg-transparent border-0 border-b border-outline-variant appearance-none focus:outline-none focus:ring-0 focus:border-primary peer text-on-surface font-body-md text-body-md transition-colors duration-300 pr-10" id="password" name="password" placeholder=" " required="" type="password"/>
<label class="absolute top-3 left-0 -translate-y-6 text-label-caps font-label-caps text-secondary duration-300 transform origin-[0] peer-placeholder-shown:translate-y-0 peer-placeholder-shown:text-body-md peer-placeholder-shown:font-body-md peer-focus:-translate-y-6 peer-focus:text-label-caps peer-focus:font-label-caps peer-focus:text-primary cursor-text" for="password">
                            Create Password
                        </label>
<button aria-label="Toggle password visibility" class="absolute right-0 top-3 text-secondary hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-4 mt-2">
<button class="w-full flex items-center justify-center py-4 px-6 rounded-lg bg-primary-container text-on-primary-container font-label-caps text-label-caps shadow-[0_4px_14px_0_rgba(134,167,137,0.2)] hover:shadow-[0_6px_20px_0_rgba(134,167,137,0.3)] hover:-translate-y-0.5 transition-all duration-300 ease-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-background" type="submit">
                        CREATE ACCOUNT
                    </button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="flex-shrink-0 mx-4 text-label-caps font-label-caps text-secondary">OR</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<button class="w-full flex items-center justify-center gap-3 py-4 px-6 rounded-lg border border-outline-variant bg-surface hover:bg-surface-variant text-on-surface font-label-md text-label-md transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-outline focus:ring-offset-background" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.66 15.63 16.88 16.81 15.69 17.61V20.35H19.26C21.35 18.42 22.56 15.6 22.56 12.25Z" fill="#4285F4"></path>
<path d="M12 23C14.97 23 17.46 22.02 19.26 20.35L15.69 17.61C14.71 18.27 13.46 18.66 12 18.66C9.18 18.66 6.78 16.75 5.92 14.19H2.23V17.05C4.03 20.62 7.71 23 12 23Z" fill="#34A853"></path>
<path d="M5.92 14.19C5.7 13.53 5.57 12.78 5.57 12C5.57 11.22 5.7 10.47 5.92 9.81V6.95H2.23C1.49 8.43 1.06 10.16 1.06 12C1.06 13.84 1.49 15.57 2.23 17.05L5.92 14.19Z" fill="#FBBC05"></path>
<path d="M12 5.34C13.62 5.34 15.07 5.9 16.22 7.01L19.34 3.89C17.46 2.14 14.97 1.06 12 1.06C7.71 1.06 4.03 3.38 2.23 6.95L5.92 9.81C6.78 7.25 9.18 5.34 12 5.34Z" fill="#EA4335"></path>
</svg>
                        Continue with Google
                    </button>
</div>
</form>
<!-- Footer Link -->
<div class="text-center mt-4">
<p class="font-body-md text-body-md text-secondary">
                    Already a member? 
                    <a class="text-primary hover:text-on-primary-container font-semibold underline decoration-transparent hover:decoration-primary transition-all duration-300 ml-1" href="#">Sign in</a>
</p>
</div>
</div>
</main>
</body></html>
