<body class="bg-background text-on-surface min-h-screen flex flex-col justify-center items-center px-container-padding-mobile md:px-container-padding-desktop antialiased">
<main class="w-full max-w-sm flex flex-col space-y-10 animate-fade-in">
<div class="flex flex-col items-center space-y-6">
<div class="h-16 w-16 flex items-center justify-center">
<img alt="Wolfitness Logo" class="h-16 w-16 object-contain opacity-90" src="../../assets/images/screen.png"/>
</div>
<div class="text-center space-y-2">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Continue your journey to focus and strength.</p>
</div>
</div>
<form class="flex flex-col space-y-6">
<div class="space-y-1">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest block" for="email">Email</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant px-0 py-2 font-body-md text-body-md text-on-surface focus:ring-0 focus:border-primary transition-colors placeholder:text-outline-variant" id="email" placeholder="Enter your email" type="email"/>
</div>
<div class="space-y-1">
<div class="flex justify-between items-end">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest block" for="password">Password</label>
</div>
<input class="w-full bg-transparent border-0 border-b border-outline-variant px-0 py-2 font-body-md text-body-md text-on-surface focus:ring-0 focus:border-primary transition-colors placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="pt-4">
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-4 rounded-lg hover:opacity-90 transition-opacity flex justify-center items-center uppercase tracking-widest font-semibold" type="submit">
                    Sign In
                </button>
</div>
</form>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="flex-shrink-0 mx-4 font-label-caps text-label-caps text-outline uppercase tracking-widest">or</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<div>
<button class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-label-md text-label-md py-4 rounded-lg hover:bg-surface-container-low transition-colors flex justify-center items-center space-x-3 shadow-sm shadow-surface-variant/20" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span>Continue with Google</span>
</button>
</div>
<div class="text-center pt-2">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? <a class="text-on-surface font-semibold hover:text-primary transition-colors border-b border-on-surface pb-0.5" href="#">Sign up</a>
</p>
</div>
</main>
